# watch events on selected resources
# requires linux "watch" command
# change '-n' to adjust refresh time in seconds
plugins:
  watch-events:
    shortCut: Shift-E
    confirm: false
    description: Get Events
    scopes:
    - all
    command: sh
    background: false
    args:
    - -c
    - 'watch -n 5 kubectl get events --context "$1" --all-namespaces --field-selector "involvedObject.name=$2"'
    - --
    - $CONTEXT
    - $NAME
  remove_finalizers:
    shortCut: Ctrl-F
    confirm: true
    dangerous: true
    scopes:
      - all
    description: Removes all finalizers
    command: kubectl
    background: true
    args:
      - patch
      - --context
      - $CONTEXT
      - --namespace
      - $NAMESPACE
      - $RESOURCE_NAME
      - $NAME
      - -p
      - '{"metadata":{"finalizers":null}}'
      - --type
      - merge
  krr:
    shortCut: Shift-K
    description: Get krr
    scopes:
      - deployments
      - daemonsets
      - statefulsets
    command: bash
    background: false
    confirm: false
    args:
      - -c
      - |
        RESOURCE_NAME="$1"; NAME="$2"; NAMESPACE="$3"; CONTEXT="$4"
        LABELS=$(kubectl get "$RESOURCE_NAME" "$NAME" -n "$NAMESPACE" --context "$CONTEXT" --show-labels | awk '{print $NF}' | awk 'NR>1')
        krr simple --cluster "$CONTEXT" --selector "$LABELS"
        echo "Press 'q' to exit"
        while : ; do
          read -n 1 k <&1
          if [[ "$k" = "q" ]] ; then
            break
          fi
        done
      - --
      - $RESOURCE_NAME
      - $NAME
      - $NAMESPACE
      - $CONTEXT
